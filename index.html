<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シンプルタイマー</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0a84ff;
      --danger: #ff3b30;
      --border: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111113;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
        --bg: #111113;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 20px; font-size: 1.1rem; font-weight: 600; color: var(--muted); }
    .display {
      font-size: 4rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .display.done { color: var(--danger); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    .inputs { display: flex; justify-content: center; gap: 8px; align-items: center; margin-bottom: 16px; }
    .inputs input {
      width: 72px;
      padding: 8px;
      font-size: 1.2rem;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    .presets { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .presets button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .controls { display: flex; gap: 8px; }
    .controls button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #startBtn { background: var(--accent); color: #fff; }
    #resetBtn { background: var(--border); color: var(--text); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="card">
    <h1>シンプルタイマー</h1>
    <div id="display" class="display">05:00</div>

    <div class="inputs">
      <input id="min" type="number" min="0" max="999" value="5" aria-label="分"> 分
      <input id="sec" type="number" min="0" max="59" value="0" aria-label="秒"> 秒
    </div>

    <div class="presets">
      <button data-sec="60">1分</button>
      <button data-sec="180">3分</button>
      <button data-sec="300">5分</button>
      <button data-sec="600">10分</button>
      <button data-sec="1500">25分</button>
    </div>

    <div class="controls">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    const minInput = document.getElementById('min');
    const secInput = document.getElementById('sec');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetBtns = document.querySelectorAll('.presets button');

    let remaining = 0;   // 残り時間 (ミリ秒)
    let endTime = 0;     // 終了予定時刻
    let timerId = null;
    let audioCtx = null;

    const format = (ms) => {
      const total = Math.ceil(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    const inputMs = () => {
      const m = Math.max(0, parseInt(minInput.value, 10) || 0);
      const s = Math.min(59, Math.max(0, parseInt(secInput.value, 10) || 0));
      return (m * 60 + s) * 1000;
    };

    const render = () => {
      display.textContent = format(remaining);
      document.title = timerId ? `${format(remaining)} - タイマー` : 'シンプルタイマー';
    };

    const setInputsDisabled = (disabled) => {
      minInput.disabled = secInput.disabled = disabled;
      presetBtns.forEach((b) => (b.disabled = disabled));
    };

    const beep = () => {
      if (!audioCtx) return;
      for (let i = 0; i < 3; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        osc.connect(gain).connect(audioCtx.destination);
        const t = audioCtx.currentTime + i * 0.4;
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      }
    };

    const tick = () => {
      remaining = Math.max(0, endTime - Date.now());
      render();
      if (remaining === 0) {
        clearInterval(timerId);
        timerId = null;
        display.classList.add('done');
        startBtn.textContent = 'スタート';
        startBtn.disabled = true;
        document.title = '終了！';
        beep();
      }
    };

    const start = () => {
      if (remaining <= 0) remaining = inputMs();
      if (remaining <= 0) return;
      // ブラウザの自動再生制限を回避するため、ユーザー操作時に AudioContext を作る
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      endTime = Date.now() + remaining;
      timerId = setInterval(tick, 100);
      startBtn.textContent = '一時停止';
      setInputsDisabled(true);
      render();
    };

    const pause = () => {
      clearInterval(timerId);
      timerId = null;
      remaining = Math.max(0, endTime - Date.now());
      startBtn.textContent = '再開';
      render();
    };

    const reset = () => {
      clearInterval(timerId);
      timerId = null;
      remaining = inputMs();
      display.classList.remove('done');
      startBtn.textContent = 'スタート';
      startBtn.disabled = false;
      setInputsDisabled(false);
      render();
    };

    startBtn.addEventListener('click', () => (timerId ? pause() : start()));
    resetBtn.addEventListener('click', reset);
    [minInput, secInput].forEach((el) => el.addEventListener('input', reset));
    presetBtns.forEach((b) =>
      b.addEventListener('click', () => {
        const total = Number(b.dataset.sec);
        minInput.value = Math.floor(total / 60);
        secInput.value = total % 60;
        reset();
      })
    );

    reset();
  </script>
</body>
</html>
